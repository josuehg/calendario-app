name: telegram-daily-report

on:
  schedule:
    - cron: "30 14 * * *"   # 9:30am hora de Perú (UTC-5), todos los días
  workflow_dispatch: {}      # permite correrlo manualmente para probar

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generar .streamlit/secrets.toml
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml <<EOF
          SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
          SUPABASE_SERVICE_KEY = "${{ secrets.SUPABASE_SERVICE_KEY }}"
          EOF
      - name: Enviar reporte a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_daily_report.py
